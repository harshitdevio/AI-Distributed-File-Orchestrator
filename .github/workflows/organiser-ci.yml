name: organiser CI 

on:
  push: 
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs: 
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5 
        with:
          go-version: '1.25.0'

      - name: Run Go Tests
        run: go test -v ./...
        working-directory: ./organiser